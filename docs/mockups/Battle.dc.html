<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전투 화면 시안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #b48cff;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 890px; width: 100%; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 14px; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 1.55; background: {{t.bg}}; color: {{t.text}}">

  <!-- 전투 전경: 적 + 좌우 참가자 컷 + 말풍선 + 전투 기록 -->
  <dc-import name="BattleScene" count="{{four}}" turn-id="{{turnId}}" bubbles="{{bubbles}}" log="{{logText}}" enemy-hp="{{enemyHp}}" hint-size="100%,560px"></dc-import>

  <div style="display: flex; gap: 14px; height: 240px">

    <!-- 왼쪽 아래: 필드와 같은 채팅 칸, 전투 채팅만 보임 -->
    <section aria-label="전투 채팅" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="min-height: 36px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 10px 10px 4px 4px; font-size: 13px; font-weight: 700; border: 1px solid #ff7a8a; background: {{t.panel2}}; color: {{t.danger}}">전투 채팅</span>
      </div>
      <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.panel}}; overflow: hidden">
        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px">
          <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
            <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 14px">
              <span style="flex: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: {{t.panel2}}; color: {{t.accent}}">{{m.initial}}</span>
              <span style="min-width: 0; padding-top: 2px">
                <span style="font-size: 12px; color: {{t.danger}}">[전투]</span>
                <span style="font-weight: 700">{{m.name}}:</span>
                <span>{{m.text}}</span>
              </span>
            </div>
          </sc-for>
        </div>
        <form onSubmit="{{send}}" style="display: flex; gap: 8px; padding: 10px; border-top: 1px solid {{t.line}}">
          <span style="height: 44px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.panel2}}; color: {{t.danger}}; font-size: 14px">전투</span>
          <label for="battle-text" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">전투 채팅 메시지</label>
          <input id="battle-text" value="{{draft}}" onChange="{{onDraft}}" placeholder="메시지 입력" autocomplete="off" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.panel2}}; color: {{t.text}}; font-size: 14px; font-family: inherit">
          <button type="submit" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid {{t.accent}}; background: {{t.accent}}; color: {{t.accentText}}; font-size: 14px; font-weight: 700; cursor: pointer">전송</button>
        </form>
      </div>
    </section>

    <!-- 프로필 카드 + 행동 메뉴: 칸 나눔 없이 한 배경 안에 (프로필 왼쪽, 메뉴 오른쪽) -->
    <div style="flex: 0 0 500px; display: flex; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.panel}}; overflow: hidden">
      <section aria-label="내 캐릭터" style="flex: 0 0 196px; box-sizing: border-box; padding: 8px 6px 12px; display: flex; flex-direction: column; align-items: center; position: relative">
        <span style="position: absolute; left: 12px; top: 6px; font-family: 'Gowun Batang', serif; font-size: 18px; font-weight: 700; color: {{t.accent}}">Lv.3</span>
        <div role="img" aria-label="세라 프로필 사진" style="position: relative; width: 112px; height: 112px; flex: none; box-sizing: border-box; border-radius: 50%; border: 3px solid {{t.accent}}; background: linear-gradient(160deg, #5b3fa0 0%, #14111d 100%); overflow: hidden"><!-- 커스텀 프사 자리 (시안에서는 사람 모양 그림으로 대신) --><svg aria-hidden="true" viewBox="0 0 100 100" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%"><circle cx="50" cy="40" r="18" fill="rgba(255,255,255,0.6)"></circle><path d="M14 100c0-22 16-38 36-38s36 16 36 38z" fill="rgba(255,255,255,0.6)"></path></svg></div>
        <p style="margin: 4px 0 0; font-size: 12px; line-height: 1.2; color: {{t.title}}">[견습 계약자]</p>
        <p style="margin: 0; font-size: 17px; line-height: 1.25; font-weight: 700">세라</p>
        <div style="width: 100%; margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 3px; font-size: 10px; line-height: 12px; color: {{t.muted}}">
              <span style="flex: none; width: 21px; font-weight: 700">{{b.label}}</span>
              <span style="flex: 1; height: 6px; background: {{t.panel2}}; overflow: hidden"><span style="{{b.fill}}"></span></span>
              <span style="flex: none; width: 42px; text-align: right">{{b.value}}</span>
            </div>
          </sc-for>
        </div>
      </section>
      <!-- 전투 명령: 아이콘 + 글씨 타일 -->
      <nav aria-label="전투 명령" style="flex: 1 1 280px; min-width: 0; box-sizing: border-box; padding: 22px 22px 22px 18px">
        <sc-if value="{{menuMain}}" hint-placeholder-val="{{true}}">
          <!-- 윗줄(2/3): 스킬(3/5) · 공격(2/5) / 아랫줄(1/3): 아이템(남은 폭 전부) · 도주(오른쪽 끝 정사각형) -->
          <div style="display: grid; grid-template-rows: 2fr 1fr; gap: 8px; height: 196px">
            <div style="display: flex; gap: 8px; min-height: 0">
              <sc-for list="{{topCommands}}" as="c" hint-placeholder-count="2">
                <button type="button" onClick="{{c.act}}" disabled="{{c.disabled}}" style="{{c.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg><span>{{c.label}}</span></button>
              </sc-for>
            </div>
            <div style="display: flex; gap: 8px; min-height: 0">
              <sc-for list="{{bottomCommands}}" as="c" hint-placeholder-count="2">
                <button type="button" onClick="{{c.act}}" disabled="{{c.disabled}}" style="{{c.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg><span>{{c.label}}</span></button>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{menuSkill}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 60px; gap: 8px">
            <sc-for list="{{skills}}" as="s" hint-placeholder-count="2">
              <button type="button" onClick="{{s.act}}" title="{{s.desc}}" style="{{tileStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{skillIcon}}"></path></svg><span>{{s.name}}</span><span style="font-size: 11px; color: {{t.muted}}">MP {{s.mp}}</span></button>
            </sc-for>
            <button type="button" onClick="{{backToMenu}}" style="{{backStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{backIcon}}"></path></svg><span>뒤로</span></button>
          </div>
        </sc-if>
      </nav>
    </div>

    <!-- 오른쪽 아이콘 메뉴: 장비 · 인벤토리 · 스테이터스 · 프로필 · 파티 · 설정 -->
    <nav aria-label="메뉴" style="position: relative; flex: 0 0 34px; display: flex; flex-direction: column; gap: 7px">
      <button type="button" onClick="{{openEquip}}" aria-label="장비" title="장비" style="{{iconBtn}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path></svg>
      </button>
      <button type="button" onClick="{{openInventory}}" aria-label="인벤토리" title="인벤토리" style="{{iconBtn}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      </button>
      <button type="button" onClick="{{openStatus}}" aria-label="스테이터스" title="스테이터스" style="{{iconBtn}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11"></path><path d="M12 20V4"></path><path d="M19 20v-6"></path></svg>
      </button>
      <button type="button" onClick="{{openProfile}}" aria-label="프로필" title="프로필" style="{{iconBtn}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2.2"></circle><path d="M5.8 16c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4"></path><path d="M14.5 10h3.5M14.5 13.5h3.5"></path></svg>
      </button>
      <button type="button" onClick="{{community}}" aria-label="파티 · 친구" title="파티 · 친구" style="{{iconBtn}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M16 14.2c3 .2 5.5 2.4 5.5 5.8"></path></svg>
      </button>
      <button type="button" onClick="{{toggleSettings}}" aria-label="설정" title="설정" aria-expanded="{{settingsExpanded}}" style="{{settingsBtn}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <!-- 설정을 누르면 설정 버튼 옆에 가로로 펼쳐진다 -->
      <sc-if value="{{settingsOpen}}" hint-placeholder-val="{{false}}">
        <div role="group" aria-label="설정 메뉴" style="position: absolute; right: 44px; bottom: 0; z-index: 5; display: flex; gap: 8px; padding: 6px; border-radius: 14px; border: 1px solid #ffd84a; background: {{t.panel}}; box-shadow: 0 6px 20px rgba(0,0,0,0.45)">
          <button type="button" disabled aria-label="음향 조절 (준비 중)" title="음향 조절 (준비 중)" style="{{iconBtnOff}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </button>
          <button type="button" onClick="{{toggleTheme}}" aria-label="테마 바꾸기" title="테마 바꾸기" style="{{iconBtn}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
          </button>
          <button type="button" onClick="{{switchChar}}" aria-label="캐릭터 변경" title="캐릭터 변경" style="{{iconBtn}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3"></path><path d="M17 17H6l3 3"></path></svg>
          </button>
          <button type="button" onClick="{{logout}}" aria-label="로그아웃" title="로그아웃" style="{{iconBtn}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path><path d="M10 16l-4-4 4-4"></path><path d="M6 12h10"></path></svg>
          </button>
        </div>
      </sc-if>
    </nav>
  </div>

  <footer style="display: flex; gap: 24px; font-size: 12px; color: {{t.muted}}">
    <span style="display: inline-flex; align-items: center; gap: 8px">
      <span>v.1</span>
      <span role="img" aria-label="서버 연결: 원활" title="서버 연결: 원활" style="display: block; width: 9px; height: 9px; border-radius: 50%; background: #4fd27a; box-shadow: 0 0 6px rgba(79,210,122,0.7)"></span>
      <span>· 3명 접속 중</span>
    </span>
    <a href="BattleSizes.dc.html" style="margin-left: auto; font-size: 14px; font-weight: 700; color: #b48cff">시안: 인원별 비교 보기 →</a>
    <a href="Main.dc.html" style="font-size: 14px; font-weight: 700; color: #b48cff">← 필드 화면으로</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":890}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      dark: true,
      menu: 'main',
      settingsOpen: false,
      round: 3,
      enemyHp: 104,
      log: '덩굴 포식자의 덩굴 휘감기! 덩굴이 조여 온다! 벨라에게 24 데미지.',
      draft: '',
      bubbles: { 2: '내 뒤로 와! 저 덩굴은 내가 막을게.', 3: '회복할게, 조금만 버텨!', 4: '……' },
      messages: [
        { name: '벨라', text: '내 뒤로 와! 저 덩굴은 내가 막을게.' },
        { name: '루미', text: '회복할게, 조금만 버텨!' },
        { name: '하나', text: '……' },
      ],
    };
    this.state.turnId = 1;
    this.bubbleTimer = null;
    this.turnTimer = null;
  }

  componentWillUnmount() {
    clearTimeout(this.bubbleTimer);
    clearTimeout(this.turnTimer);
  }

  // 시안용: 내가 행동하면 별라 → 루미 차례를 지나 다시 내 차례로 돌아온다 (하나는 쓰러져 있어서 건너뜀).
  passTurn() {
    clearTimeout(this.turnTimer);
    const order = [2, 3, 1];
    let i = 0;
    const step = () => {
      this.setState({ turnId: order[i], menu: 'main' });
      i += 1;
      if (i < order.length) this.turnTimer = setTimeout(step, 1500);
    };
    step();
  }

  hit(label, dmg) {
    this.setState((s) => {
      const hp = Math.max(0, s.enemyHp - dmg);
      return {
        enemyHp: hp,
        menu: 'main',
        log: hp === 0 ? `세라의 ${label}! 덩굴 포식자에게 ${dmg} 데미지.\n덩굴 포식자를 쓰러뜨렸다!` : `세라의 ${label}! 덩굴 포식자에게 ${dmg} 데미지.`,
      };
    });
  }

  renderVals() {
    const s = this.state;
    const t = s.dark
      ? { bg: '#0f0e15', panel: '#1a1823', panel2: '#23202f', line: '#34304a', text: '#e7e3f2', muted: '#a49eba', accent: '#b48cff', accentText: '#160f24', title: '#f2c97a', danger: '#ff9aa6' }
      : { bg: '#f3f0f8', panel: '#ffffff', panel2: '#ece8f4', line: '#d4cde4', text: '#1d1a28', muted: '#5c5570', accent: '#6b3fd1', accentText: '#ffffff', title: '#9a5b00', danger: '#b4233a' };
    const mine = s.turnId === 1;
    // 타일 아이콘 (선 하나로 그린 모양)
    const ICONS = {
      이동: 'M5 12h14M13 6l6 6-6 6',
      둘러보기: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
      '토벌 목록': 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01',
      '토벌 입장': 'M14.5 4.5L20 4l-.5 5.5L9 20l-5-5zM7 13l4 4',
      공격: 'M14.5 4.5L20 4l-.5 5.5L9 20l-5-5zM7 13l4 4',
      스킬: 'M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',
      아이템: 'M9 3h6M10 3v5l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3',
      방어: 'M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z',
      도주: 'M15 12H3M7 8l-4 4 4 4M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4',
      뒤로: 'M19 12H5M11 6l-6 6 6 6',
    };
    const tile = `display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; border-radius: 10px; border: 1px solid ${t.line}; background: ${t.panel2}; color: ${t.text}; font-size: 12px; line-height: 1.25; text-align: center; cursor: pointer`;
    const tileBack = `${tile}; background: transparent; color: ${t.muted}`;
    const btn = tile;
    // 전투 명령 4개의 자리: 왼쪽 위 스킬(크게)·아래 공격, 오른쪽 위 아이템·아래 도주
    const commands = [
      { label: '공격', act: () => this.hit('공격', 14) },
      { label: '스킬', act: () => this.setState({ menu: 'skill' }) },
      { label: '아이템', act: () => this.setState({ log: '세라은(는) 회복 사탕을(를) 사용했다. (HP +17)' }) },
      { label: '도주', act: () => this.setState({ log: '세라은(는) 도망치려 했지만 실패했다.' }), flee: true },
    ].map((c) => ({
      ...c,
      icon: ICONS[c.label],
      disabled: !mine,
      act: () => { c.act(); if (c.label !== '스킬') this.passTurn(); },
      // 내 차례가 아니면 모두 비활성 (도주처럼 흐린 색)
      style: !mine || c.flee ? `${btn}; background: transparent; color: ${t.muted};${mine ? '' : ' cursor: default; opacity: 0.7'}` : btn,
    }));
    const bar = (label, value, max, color) => ({
      label,
      value: `${value}/${max}`,
      fill: `display: block; height: 100%; width: ${Math.round((value / max) * 100)}%; background: ${color}`,
    });
    return {
      t,
      dark: s.dark,
      four: 4,
      round: s.round,
      enemyHp: s.enemyHp,
      turnId: s.turnId,
      navBorder: mine ? t.accent : t.line,
      logText: s.log,
      bubbles: s.bubbles,
      messages: s.messages.map((m) => ({ ...m, initial: m.name.slice(0, 1) })),
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: (e) => {
        e.preventDefault();
        const text = s.draft.trim();
        if (!text) return;
        // 채팅 칸에 쌓이고, 전경의 내 컷 옆 말풍선으로 5초간 뜬다.
        this.setState((st) => ({ draft: '', messages: [...st.messages, { name: '세라', text }].slice(-40), bubbles: { ...st.bubbles, 1: text } }));
        clearTimeout(this.bubbleTimer);
        this.bubbleTimer = setTimeout(() => this.setState((st) => ({ bubbles: { ...st.bubbles, 1: '' } })), 5000);
      },
      menuMain: s.menu === 'main',
      menuSkill: s.menu === 'skill',
      commands,
      topCommands: [['스킬', 'flex: 3 1 0; min-width: 0'], ['공격', 'flex: 2 1 0; min-width: 0']]
        .map(([l, size]) => { const c = commands.find((x) => x.label === l); return { ...c, style: `${c.style}; ${size}` }; }),
      bottomCommands: [['아이템', 'flex: 1 1 0; min-width: 0'], ['도주', 'flex: 0 0 auto; height: 100%; aspect-ratio: 1 / 1']]
        .map(([l, size]) => { const c = commands.find((x) => x.label === l); return { ...c, style: `${c.style}; ${size}` }; }),
      skills: [
        { name: '별빛 일격', mp: 8, desc: '내 속성으로 강하게 내리친다.', act: () => { this.hit('별빛 일격', 34); this.passTurn(); } },
        { name: '연속 베기', mp: 10, desc: '물리 공격 2회.', act: () => { this.hit('연속 베기', 22); this.passTurn(); } },
      ],
      backToMenu: () => this.setState({ menu: 'main' }),
      backIcon: ICONS.뒤로,
      backStyle: tileBack,
      tileStyle: tile,
      skillIcon: ICONS.스킬,
      bars: [bar('HP', 108, 125, '#6fd39b'), bar('MP', 31, 75, '#6fa8ff'), bar('EXP', 90, 150, t.accent)],
      userMenu: ['장비', '인벤토리', '스테이터스', '프로필'].map((label) => ({
        label,
        act: () => this.setState({ log: `(시안) 전투 중에는 ${label} 창을 볼 수만 있어요.` }),
      })),
      openEquip: () => ((text) => this.setState({ log: text.replace('창이 열립니다', '창을 볼 수만 있어요 (전투 중)') }))('(시안) 장비 창이 열립니다. 무기 · 의상 · 장신구 3칸.'),
      openInventory: () => ((text) => this.setState({ log: text.replace('창이 열립니다', '창을 볼 수만 있어요 (전투 중)') }))('(시안) 인벤토리 창이 열립니다. 골드는 여기서 보입니다. — 232 G'),
      openStatus: () => ((text) => this.setState({ log: text.replace('창이 열립니다', '창을 볼 수만 있어요 (전투 중)') }))('(시안) 스테이터스 창이 열립니다. 스탯 분배, 스킬 목록.'),
      openProfile: () => ((text) => this.setState({ log: text.replace('창이 열립니다', '창을 볼 수만 있어요 (전투 중)') }))('(시안) OC 프로필 창이 열립니다. 프로필 사진, 외형, 성격, 설정, 소개글, 커스텀 대사, 관계.'),
      settingsOpen: s.settingsOpen,
      settingsExpanded: s.settingsOpen ? 'true' : 'false',
      toggleSettings: () => this.setState((st) => ({ settingsOpen: !st.settingsOpen })),
      iconBtn: `width: 34px; height: 34px; flex: none; border-radius: 12px; border: 1px solid ${t.line}; background: ${t.panel}; color: ${t.text}; display: grid; place-items: center; cursor: pointer`,
      iconBtnOff: `width: 34px; height: 34px; flex: none; border-radius: 12px; border: 1px solid ${t.line}; background: ${t.panel}; color: ${t.muted}; opacity: 0.55; display: grid; place-items: center`,
      settingsBtn: s.settingsOpen
        ? 'width: 34px; height: 34px; border-radius: 12px; border: 1px solid #ffd84a; background: rgba(255,216,74,0.16); color: #ffd84a; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 10px rgba(255,216,74,0.45)'
        : `width: 34px; height: 34px; border-radius: 12px; border: 1px solid ${t.line}; background: ${t.panel}; color: ${t.text}; display: grid; place-items: center; cursor: pointer`,
      toggleTheme: () => this.setState((st) => ({ dark: !st.dark })),
      switchChar: () => this.setState({ settingsOpen: false, log: '(시안) 전투 중에는 캐릭터를 바꿀 수 없어요.' }),
      logout: () => this.setState({ settingsOpen: false, log: '(시안) 로그아웃하면 전투에서 빠집니다.' }),
      community: () => this.setState({ log: '(시안) 파티 · 친구 창이 열립니다. 친구 추가, 파티 초대.' }),
    };
  }
}
</script>
</body>
</html>
