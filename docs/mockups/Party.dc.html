<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>파티 창 시안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #b48cff;outline-offset:2px}
</style>
</helmet>
<!-- 필드 화면 위에 뜨는 팝업 (뒤는 어둡게) -->
<div style="width: 1440px; height: 890px; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; line-height: 1.5; background: radial-gradient(ellipse at 50% 30%, #2a3b33 0%, #12161a 70%); color: {{t.text}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,4,10,0.6)"></div>

  <div style="position: relative; z-index: 1; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5))">
    <button type="button" aria-label="파티 창 닫기" style="position: absolute; right: 12px; top: 10px; z-index: 6; width: 18px; height: 18px; padding: 0; border: none; background: transparent; color: #ffffff; font-size: 13px; line-height: 1; cursor: pointer">×</button>
    <section role="dialog" aria-label="파티" style="position: relative; width: 480px; height: 400px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 22px 24px 18px; background: linear-gradient(135deg, {{t.panel}} 0%, {{t.bg}} 100%)">

      <!-- 우클릭 메뉴가 열려 있을 때, 다른 데를 누르면 닫힘 -->
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
        <div aria-hidden="true" onClick="{{closeMenu}}" onContextMenu="{{closeMenu}}" style="position: absolute; inset: 0; z-index: 3"></div>
      </sc-if>

      <header style="display: flex; flex-direction: column; gap: 8px; padding-right: 24px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h1 style="margin: 0; font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 700">{{partyName}}</h1>
          <span style="font-size: 13px; color: {{t.muted}}">{{count}} / 4명</span>
        </div>
        <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; color: {{t.accent}}">
          <span style="flex: 1; height: 2px; background: {{t.accent}}"></span>
          <span style="font-size: 14px; line-height: 1">✦</span>
          <span style="flex: 1; height: 2px; background: {{t.accent}}"></span>
        </div>
      </header>

      <sc-if value="{{left}}" hint-placeholder-val="{{false}}">
        <p style="flex: 1; margin: 0; display: grid; place-items: center; color: {{t.muted}}">파티에서 나왔어요. (시안: 창을 다시 열면 원래대로)</p>
      </sc-if>
      <!-- 멤버 목록 (파티장이 맨 위) -->
      <ul aria-label="파티 멤버" style="flex: 1; min-height: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="3">
          <li onContextMenu="{{m.openMenu}}" title="{{m.hint}}" style="{{m.rowStyle}}">
            <span aria-hidden="true" style="{{m.avatar}}">{{m.initial}}</span>
            <span style="flex: 1; min-width: 0">
              <b style="font-weight: 700; color: {{m.nameColor}}">{{m.name}}</b>
              <sc-if value="{{m.leader}}" hint-placeholder-val="{{false}}">
                <span style="margin-left: 4px; font-size: 12px; color: {{t.title}}">👑 파티장</span>
              </sc-if>
              <span style="display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: {{t.muted}}">Lv.{{m.level}} · {{m.cls}} · 📍 {{m.where}}</span>
            </span>
            <span style="flex: none; font-size: 12px; color: {{m.stateColor}}">● {{m.state}}</span>
            <!-- 우클릭 메뉴 -->
            <sc-if value="{{m.menu}}" hint-placeholder-val="{{false}}">
              <div role="menu" aria-label="{{m.name}} 메뉴" style="position: absolute; right: 12px; top: 40px; z-index: 4; min-width: 120px; padding: 4px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.bg}}; box-shadow: 0 8px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column">
                <sc-if value="{{m.me}}" hint-placeholder-val="{{false}}">
                  <button type="button" role="menuitem" onClick="{{leave}}" style="{{menuItem}}; color: #ff8a96">파티 나가기</button>
                </sc-if>
                <sc-if value="{{m.other}}" hint-placeholder-val="{{true}}">
                  <button type="button" role="menuitem" onClick="{{m.makeLeader}}" style="{{menuItem}}">파티장 위임</button>
                  <button type="button" role="menuitem" onClick="{{m.kick}}" style="{{menuItem}}; color: #ff8a96">추방</button>
                </sc-if>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ul>

      <footer style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
        <span role="status" style="font-size: 12px; color: {{t.muted}}">{{notice}}</span>
        <button type="button" onClick="{{openInvite}}" style="height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.panel2}}; color: {{t.text}}; font-size: 12px; cursor: pointer">+ 초대</button>
      </footer>

      <!-- 초대 팝업 -->
      <sc-if value="{{inviteOpen}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(5,4,10,0.55)">
          <form onSubmit="{{sendInvite}}" role="dialog" aria-label="파티 초대" style="position: relative; width: 280px; box-sizing: border-box; padding: 18px; display: flex; flex-direction: column; gap: 10px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.panel}}">
            <button type="button" onClick="{{closeInvite}}" aria-label="초대 닫기" style="position: absolute; right: 10px; top: 8px; width: 18px; height: 18px; padding: 0; border: none; background: transparent; color: #ffffff; font-size: 13px; line-height: 1; cursor: pointer">×</button>
            <label for="invite-name" style="font-size: 14px; font-weight: 700">초대할 캐릭터 이름</label>
            <input id="invite-name" value="{{inviteName}}" onChange="{{onInviteName}}" placeholder="예: 유키" autocomplete="off" style="height: 38px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.panel2}}; color: {{t.text}}; font-size: 14px">
            <p role="status" style="margin: 0; min-height: 18px; font-size: 12px; color: {{inviteMsgColor}}">{{inviteMsg}}</p>
            <button type="submit" style="height: 34px; border-radius: 8px; border: none; background: {{t.accent}}; color: {{t.accentText}}; font-size: 14px; font-weight: 700; cursor: pointer">초대 보내기</button>
            <p style="margin: 0; font-size: 11px; color: {{t.muted}}">시안: 미오 · 카논 = 접속 중, 유키 = 오프라인</p>
          </form>
        </div>
      </sc-if>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":890}}'>
const ONLINE = ['미오', '카논'];
const OFFLINE = ['유키'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      dark: true,
      partyName: '세라의 파티', // 기본: 만든 사람 이름 + 의 파티
      members: [
        { name: '세라', level: 3, cls: '어태커', me: true, status: 'online', where: '공원 균열 - 숲길', tint: '#5b3fa0' },
        { name: '릴리', level: 5, cls: '서포터', status: 'battle', where: '공원 균열 - 균열의 중심', tint: '#2f6f8f' },
        { name: '벨라', level: 4, cls: '가디언', status: 'offline', where: '본부 - 광장', tint: '#8f4a2f' },
      ],
      leader: '세라',
      menu: null,
      left: false,
      inviteOpen: false, inviteName: '', inviteMsg: '', inviteOk: null,
      notice: '멤버를 우클릭하면 메뉴가 떠요.',
    };
  }

  theme() {
    return this.state.dark
      ? { bg: '#0f0e15', panel: '#1a1823', panel2: '#23202f', line: '#34304a', text: '#e7e3f2', muted: '#a49eba', accent: '#b48cff', accentText: '#160f24', title: '#f2c97a' }
      : { bg: '#f3f0f8', panel: '#ffffff', panel2: '#ece8f4', line: '#d4cde4', text: '#1d1a28', muted: '#5c5570', accent: '#6b3fd1', accentText: '#ffffff', title: '#9a5b00' };
  }

  renderVals() {
    const t = this.theme();
    const s = this.state;
    const me = s.members.find((m) => m.me);
    const amLeader = s.leader === me.name;
    // 파티장이 맨 위
    const sorted = [...s.members].sort((a, b) => (b.name === s.leader) - (a.name === s.leader));
    const members = sorted.map((m) => {
      const leader = m.name === s.leader;
      // 나: [파티 나가기] / 다른 사람: 내가 파티장일 때만 [파티장 위임] [추방]
      const canMenu = m.me || amLeader;
      const ST = { online: ['접속 중', '#7fd49a'], battle: ['전투 중', '#ff5c6c'], offline: ['오프라인', t.muted] }[m.status];
      return {
        ...m, leader,
        other: !m.me,
        nameColor: m.me ? t.accent : t.text,
        initial: m.name.slice(0, 1),
        hint: m.me ? '우클릭: 파티 나가기' : canMenu ? '우클릭: 파티장 위임 · 추방' : '',
        state: ST[0],
        stateColor: ST[1],
        menu: s.menu === m.name,
        rowStyle: `position: relative; height: 54px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 10px; background: ${s.menu === m.name ? t.line : t.panel2}; ${leader ? `box-shadow: inset 3px 0 0 ${t.title};` : ''} cursor: ${canMenu ? 'context-menu' : 'default'}`,
        avatar: `flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #ffffff; background: linear-gradient(160deg, ${m.tint} 0%, #14111d 100%); ${m.status === 'offline' ? 'filter: grayscale(1) brightness(0.7);' : ''}`,
        openMenu: (e) => { e.preventDefault(); if (canMenu) this.setState({ menu: m.name }); },
        makeLeader: () => this.setState({ leader: m.name, menu: null, notice: `${m.name}에게 파티장을 넘겼어요.` }),
        kick: () => this.setState((st) => ({ members: st.members.filter((x) => x.name !== m.name), menu: null, notice: `${m.name}을(를) 파티에서 내보냈어요.` })),
      };
    });

    return {
      t, amLeader,
      members: s.left ? [] : members,
      left: s.left,
      // 파티장이 나가면 다음 사람이 파티장이 된다
      leave: () => this.setState({ left: true, menu: null, notice: '' }),
      partyName: s.partyName,
      count: s.members.length,
      notice: s.notice,
      menuOpen: Boolean(s.menu),
      closeMenu: (e) => { if (e) e.preventDefault(); this.setState({ menu: null }); },
      menuItem: `height: 32px; padding: 0 10px; text-align: left; border-radius: 6px; border: none; background: transparent; color: ${t.text}; font-size: 13px; cursor: pointer`,
      inviteOpen: s.inviteOpen,
      openInvite: () => this.setState({ inviteOpen: true, inviteName: '', inviteMsg: '', inviteOk: null }),
      closeInvite: () => this.setState({ inviteOpen: false }),
      inviteName: s.inviteName,
      onInviteName: (e) => this.setState({ inviteName: e.target.value, inviteMsg: '' }),
      inviteMsg: s.inviteMsg,
      inviteMsgColor: s.inviteOk ? '#7fd49a' : '#ff8a96',
      sendInvite: (e) => {
        e.preventDefault();
        const n = s.inviteName.trim();
        if (!n) return this.setState({ inviteMsg: '이름을 적어 주세요.', inviteOk: false });
        if (s.members.length >= 4) return this.setState({ inviteMsg: '파티가 가득 찼어요. (최대 4명)', inviteOk: false });
        if (s.members.some((m) => m.name === n)) return this.setState({ inviteMsg: '이미 파티에 있는 캐릭터예요.', inviteOk: false });
        if (OFFLINE.includes(n)) return this.setState({ inviteMsg: '캐릭터가 오프라인입니다.', inviteOk: false });
        if (!ONLINE.includes(n)) return this.setState({ inviteMsg: '그런 이름의 캐릭터가 없어요.', inviteOk: false });
        this.setState({ inviteOpen: false, notice: `${n}에게 초대를 보냈어요. 수락하면 파티에 들어와요.` });
      },
    };
  }
}
</script>
</body>
</html>
